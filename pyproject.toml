[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikifier"
dynamic = ["version"]
description = "Zero-dependency agent-to-agent codebase wiki for LLMs and AI agents. Autonomously maintained via record-change and mark-green for token-efficient lookup of files, dependencies, health, and summaries — across tiny scripts to 50k+ monorepos. Optional MCP server with rich tools for agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aron Amos", email = "aron@example.com"}
]
maintainers = [
    {name = "Aron Amos"}
]
requires-python = ">=3.8"
keywords = [
    "wiki", "documentation", "llm", "agent", "mcp", "codebase", 
    "health-matrix", "zero-dependency", "shell", "token-efficient", 
    "autonomous", "record-change", "mark-green", "agent-wiki", 
    "llm-tools", "dependency-graph", "monorepo"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Version Control",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = []  # Zero-dependency by default. MCP support is optional.

[project.urls]
Homepage = "https://github.com/IronAdamant/wikifier"
Repository = "https://github.com/IronAdamant/wikifier"
Documentation = "https://github.com/IronAdamant/wikifier#readme"
"Bug Tracker" = "https://github.com/IronAdamant/wikifier/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
wikifier = "wikifier.cli:main"
wikifier-mcp = "wikifier.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["wikifier*", "skills"]

[tool.setuptools.package-data]
wikifier = ["scripts/*", "index.html"]
skills = ["*.md"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__"]

[tool.setuptools.dynamic]
version = {attr = "wikifier.__version__"}
