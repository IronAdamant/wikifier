[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikifier"
version = "0.3.0"
description = "Agent-first, zero-dependency, self-maintaining codebase documentation & change tracking system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aron Amos", email = "aron@example.com"}
]
maintainers = [
    {name = "Aron Amos"}
]
requires-python = ">=3.8"
keywords = [
    "wiki", "documentation", "llm", "agent", "mcp", "codebase", 
    "health-matrix", "zero-dependency", "shell"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Version Control",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/IronAdamant/wikifier"
Repository = "https://github.com/IronAdamant/wikifier"
Documentation = "https://github.com/IronAdamant/wikifier#readme"
"Bug Tracker" = "https://github.com/IronAdamant/wikifier/issues"

[project.scripts]
wikifier = "wikifier.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["wikifier*"]

[tool.setuptools.package-data]
wikifier = ["scripts/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__"]

[tool.setuptools.dynamic]
version = {attr = "wikifier.__version__"}
