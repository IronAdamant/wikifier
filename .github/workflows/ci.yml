name: CI

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        experimental: [false]
        include:
          - os: windows-latest
            experimental: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Empty dependency list
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /^\[(dependencies|dev-dependencies|build-dependencies)\]/ { section=$0; in_deps=1; next }
            /^\[/ { in_deps=0 }
            in_deps && $0 ~ /^[[:space:]]*[^#[:space:]]/ { print section ": " $0; bad=1 }
            END { exit bad ? 1 : 0 }
          ' Cargo.toml

      - name: Version
        run: cargo run --quiet -- --version
