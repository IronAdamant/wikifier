name: CI

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
          pip install -e .
          # mcp extra requires Python >=3.10 (PyPI has no mcp wheel for 3.8/3.9).
          # Core tests still run; test_server_has_main skipTest without the extra.
          if python -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 10) else 1)'; then
            pip install -e '.[mcp]'
          fi
      
      - name: Run tests
        run: python -m unittest discover tests -v
      
      - name: Verify package build and wheel CLI
        run: |
          python -m build --wheel --outdir dist/
          python -m venv /tmp/wikifier-wheel
          /tmp/wikifier-wheel/bin/pip install dist/wikifier-*.whl
          /tmp/wikifier-wheel/bin/wikifier --help
