name: CI

on:
  push:
    branches:
      - main
      - 'cursor/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        experimental: [false]
        include:
          - os: windows-latest
            experimental: true

    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Empty dependency list
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          python3 - <<'PY'
          import json
          data = json.load(open("metadata.json"))
          for pkg in data["packages"]:
              deps = pkg.get("dependencies") or []
              assert deps == [], (pkg["name"], deps)
          PY

      - name: Version
        run: cargo run --quiet -- --version
